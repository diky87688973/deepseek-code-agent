; ═══════════════════════════════════════════
; DeepSeek Code Agent 配置文件
; 优先级：config.ini > 环境变量 > 内置默认值
; ═══════════════════════════════════════════

[model]
# API 请求地址，默认 DeepSeek 官方
api_base_url = https://api.deepseek.com
# API 密钥（留空则从环境变量 CHAT_API_KEY 读取）
api_key =

[server]
# 服务监听端口
port = 8801

[workspace]
# 工作区根目录（留空则用用户桌面）
dir = D:/FanFiles/workspace
# 运行时数据目录（日志、会话缓存、待办清单等）
data_root = D:/AI_DATA_ROOT

[knowledge_base]
# 知识库文件目录（留空禁用）
dir = D:/AI_DATA_ROOT/knowledge_base
# 知识库单文件大小上限（字节）
max_file_size = 200000

[session]
# 会话加密模式：auto / none / force
encryption = none
# 会话加密密钥文件路径（留空则自动生成）
key_file =

[context]
# 单会话历史消息上限（含工具记录）
history_max_messages = 1000
# 开始截取做摘要的起始位置
excerpt_start_index = 199
# 压缩上下文时保留的最近对话轮数（含工具记录）
recent_user_rounds = 200
# 摘要进行中的 TTL（秒）
summary_ttl_sec = 300.0
# 每轮对话允许工具调用的次数上限
max_tool_rounds = 500

[ui]
# 页面重开时最多恢复的会话标签数
restore_max_tabs = 8
# 每个会话恢复的最近聊天气泡数
restore_max_chat_items = 200
# 触发直出预览的关键词（逗号分隔）
preview_intent_keys = 预览, 原文, 全文, 完整内容, 原始内容, 显示文件, 打开, 查看, 读取, 给我看看, 看一下, 看一看

[misc]
# 推理强度：high / max
reasoning_effort = max
# @路径是否自动预读注入（true=启用预注入，agent直接读取文件插入到上下文中; false=走LLM让工具分批读取，对大文件友好）
at_message_file_prefetch = false
# 是否解锁代码更新功能，用于start.sh/start.bat启动时有用
unlock_code_update = false
