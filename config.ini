; ═══════════════════════════════════════════
; DeepSeek Code Agent 配置文件
; 优先级：config.ini > 环境变量（无内置默认值，缺失报错）
; ═══════════════════════════════════════════

[model]
# API 请求地址，默认 DeepSeek 官方
api_base_url = https://api.deepseek.com
# API 密钥（留空则从环境变量 CHAT_API_KEY 读取）
api_key =
# 允许的模型列表（逗号分隔）
allowed_models = deepseek-v4-pro, deepseek-v4-flash
# 默认模型
default_model = deepseek-v4-flash

[server]
# 服务本机ip
host = 127.0.0.1
# 服务监听端口
port = 8801

[workspace]
# 工作区根目录
dir = D:/AI_DATA_ROOT/workspace
# 运行时数据目录（日志、会话缓存、待办清单等）
runtime_data_root = D:/AI_DATA_ROOT

[skills]
# skills文件目录（留空禁用）
dir = D:/AI_DATA_ROOT/skills
# skills单文件大小上限（字节）
max_file_size = 200000

[knowledge_base]
# 知识库文件目录（留空禁用）
dir = D:/AI_DATA_ROOT/knowledge_base
# 知识库单文件大小上限（字节）
max_file_size = 200000

[session]
# 会话加密模式：auto / none / force
encryption = none
# 会话加密密钥文件路径（留空则自动生成）
key_file =

[context]
# 上下文比例条总预算token量
layout_budget_tokens = 1000000
# 摘要触发阈值：消息总 token 数超过此值时触发摘要压缩
summary_token_threshold = 768000
# 摘要进行中的 TTL（秒）
summary_ttl_sec = 300.0
# AI 摘要时是否启用思考链（enabled/disabled）
summary_thinking = enabled
# 摘要模型输出正文字数上限（提示词约束，非输入截断）
summary_output_max_chars = 5000
# 近期「含工具」完整链：末尾 N 个 user 回合
full_user_rounds = 10
# 远期纯对话：紧挨近期之前再取 M 个 user 回合（折叠为纯对话）；0 表示不要远期带
pure_user_rounds = 20
# 每轮对话允许工具调用的次数上限
max_tool_rounds = 500
# token计算策略（estimate:估算模式）
token_method = estimate
# 估算模式：每英文字符、每中日韩等宽字符的约当 token（可微调）
token_estimate_en_per_char = 0.3
token_estimate_zh_per_char = 0.6

[ui]
# 页面重开时最多恢复的会话标签数
restore_max_tabs = 8
# 每个会话恢复的最近聊天气泡数
restore_max_chat_items = 200
# 触发直出预览的关键词（逗号分隔）
preview_intent_keys = 预览, 原文, 全文, 完整内容, 原始内容, 显示文件, 打开, 查看, 读取, 给我看看, 看一下, 看一看

[misc]
# 推理强度：high / max
reasoning_effort = max
# 推理增量字段名（逗号分隔，用于提取思考链内容）
reasoning_delta_fields = reasoning_content,reasoning
# 控制台日志级别（1=正常输出，0=安静模式）
console_log = 1
# 工具调用调试记录（1=启用，0=关闭）
tool_debug = 1
# @路径是否自动预读注入（true=启用预注入，agent直接读取文件插入到上下文中; false=走LLM让工具分批读取，对大文件友好）
at_message_file_prefetch = false
# 是否解锁代码更新功能，用于start.sh/start.bat启动时有用
unlock_code_update = false
# 流式响应是否包含usage信息（1=包含，0=不包含）
stream_include_usage = 1
# 额外HTTP请求头（JSON对象字符串，如 {"X-Custom":"value"}，用于非标网关鉴权或Trace跟踪）
extra_headers_json =
# 定价数据来源：auto / deepseek / fetch / html / static_only / off
#   auto        自动（优先fetch网页，失败则回退到 static_only）
#   deepseek/fetch/html  从 pricing_page_url 抓取DeepSeek官方定价页
#   static_only/off      仅使用 pricing_json 静态数据，不从网络获取
pricing_source = auto
# DeepSeek定价页面URL（pricing_source=auto/deepseek/fetch/html 时从此URL抓取定价）
pricing_page_url = https://api-docs.deepseek.com/zh-cn/quick_start/pricing/
# 静态定价JSON（内联JSON字符串，格式见下方示例）
# 例如：{"deepseek-v4-pro":{"cache_hit_cny_per_m":0.025,"cache_miss_cny_per_m":3,"output_cny_per_m":6},"deepseek-v4-flash":{"cache_hit_cny_per_m":0.02,"cache_miss_cny_per_m":1,"output_cny_per_m":2}}
# pro当前2.5折（至2026/05/31），原价为 cache_miss:12 / output:24 / cache_hit:0.1
# 可用 __default__ 为field作为通配模型名
pricing_json = {"deepseek-v4-pro":{"cache_hit_cny_per_m":0.025,"cache_miss_cny_per_m":3,"output_cny_per_m":6},"deepseek-v4-flash":{"cache_hit_cny_per_m":0.02,"cache_miss_cny_per_m":1,"output_cny_per_m":2}}

[kling]
# 可灵 AI API 访问密钥
api_key =
secret_key =
# API 请求地址
api_base_url = https://api-beijing.klingai.com

[dreamina]
# 即梦 CLI 可执行文件路径（留空则从 PATH 和 HOME 目录自动查找）
cli_path =

[agent]
# 创建 Agent 时的名字池（逗号分隔），不指定名字时从此池中自动选取
name_pool = 庭撩, Z婆哥, Donger, 死装哥, 贵er, 付凡, 小明, 小红, 张三, 李四, 王五, 赵六

